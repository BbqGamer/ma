run:
  method: sweep
  function: ackley
  regenerate_data: true
  num_samples: 20000
  num_sigmas: 3
  sigma_scale: 5.0
  train_samples: 10000
  noise_ratio: 0.03
  seed: 42
  experiment_name: sweep-ackley-v3-ratio
  sweep_storage: sqlite:///reports/optuna/sweep_ackley_v3_ratio.db
  n_trials: 90
  epochs: 700
  patience: 25
  min_delta: 0.00001
  report_interval: 10
  grid_res: 80
  model_archs: "mlp,siren,fourier"
  min_train_per_param: 5.0
  max_train_per_param: 10.0
