  hidden_dim: 16
  num_blocks: 4
  activation: silu
  epochs: 300
  batch_size: 32
  lr: 0.00013525690179051148
  patience: 40
  min_delta: 0.000001
  min_train_per_param: 10.0
  # Only schedule varies
  schedule_num_losses: 4
